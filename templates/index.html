<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            height: 100vh;
            margin: 0;
        }
        .sidebar {
            width: 280px;
            background-color: #f8f9fa;
            border-right: 1px solid #ddd;
            padding: 20px;
        }
        .content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h5>Navigation</h5>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="/dashboard" class="nav-link active" id="dashboard-tab">Dashboard</a>
            </li>
            <li>
                <a href="/predict-ai" class="nav-link" id="predict-ai-tab">Predict AI</a>
            </li>
            <li>
                <a href="/predict-ml" class="nav-link" id="predict-ml-tab">Predict ML</a>
            </li>
        </ul>
        <div class="mt-auto text-center" id="current-time" style="font-size: 1rem; font-weight: bold; padding-top: 20px;"></div>
    </div>
    <div class="content" id="dynamic-content">
        <h1>Welcome</h1>
        <p>Select a tab from the sidebar to view its content.</p>
    </div>

    <script>
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function(event) {
                event.preventDefault();
                fetch(this.href)
                    .then(response => response.text())
                    .then(html => {
                        document.getElementById('dynamic-content').innerHTML = html;
                        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                        this.classList.add('active');
                    });
            });
        });
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { hour12: false }) + ':' + now.getMilliseconds();
            document.getElementById('current-time').textContent = timeString;
        }
        setInterval(updateTime, 50); // Update every 50ms
        updateTime(); // Initial call to display time immediately
    </script>
</body>
</html>
